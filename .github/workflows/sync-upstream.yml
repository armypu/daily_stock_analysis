# 定义工作流的名称，显示在 GitHub Actions 页面中
name: Auto Sync Upstream

# 定义触发工作流的条件
on:
  # 定时触发：使用 Cron 表达式
  # '0 2 * * *' 表示每天 UTC 时间凌晨 2 点运行（北京时间上午 10 点）
  # 如果你想更频繁，可以改为 '0 */6 * * *' (每6小时)
  schedule:
    - cron: '0 2 * * *'

  # 允许手动触发：方便你在需要时立即点击按钮同步，无需等待定时
  workflow_dispatch:

# 定义工作流要执行的任务
jobs:
  sync-upstream:
    # 指定运行环境为最新的 Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 第一步：检出你自己的仓库代码
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          # 必须设置为 true，否则无法推送代码回仓库
          persist-credentials: false
          # 获取完整的 Git 历史记录，确保能正确合并
          fetch-depth: 0

      # 第二步：配置 Git 用户信息（这是提交合并记录所必需的）
      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 第三步：添加上游远程仓库并拉取最新代码
      - name: Add upstream and fetch
        run: |
          # 添加原作者的仓库地址作为名为 'upstream' 的远程源
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          # 从上游拉取所有分支的最新信息
          git fetch upstream

      # 第四步：将上游的 main 分支合并到你当前的 main 分支
      - name: Merge upstream changes
        run: |
          # 确保当前处于 main 分支
          git checkout main
          # 执行合并操作
          # --no-edit 表示直接使用默认的合并信息，不弹出编辑器
          # 如果发生冲突，此步骤会失败，你需要手动处理
          git merge upstream/main --no-edit

      # 第五步：将合并后的代码推送到你的 GitHub 仓库
      - name: Push changes to origin
        run: |
          # 使用 GITHUB_TOKEN 进行身份验证以推送代码
          # 注意：如果你的仓库有分支保护规则，可能需要 Personal Access Token
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
