name: Auto Sync Upstream

on: 
  schedule: 
    - cron: '0 2 * * *' # 每天 UTC 2点 (北京时间10点)
  workflow_dispatch: # 允许手动点击运行

# 【关键修复】显式授予写入权限
# 即使使用了 PAT，显式声明权限也是最佳实践
permissions:
  contents: write
  workflows: write 

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          # 设置为 false，因为我们稍后会用自定义的 Token 重新配置远程地址
          # 这样可以避免默认 GITHUB_TOKEN 的权限限制干扰
          persist-credentials: false 
          fetch-depth: 0 # 获取所有历史记录，确保合并准确

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          git fetch upstream

      - name: Merge upstream changes
        run: |
          git checkout main
          # 尝试合并上游 main 分支的更改
          # --no-edit 表示使用默认的合并提交信息，不弹出编辑器
          git merge upstream/main --no-edit

      - name: Push changes to origin
        run: |
          # 【核心修改】使用 secrets.MY_PAT 替代默认的 GITHUB_TOKEN
          # 这里的 MY_PAT 就是你在仓库 Settings -> Secrets 中添加的变量名
          # x-access-token 是 GitHub 认证的标准用户名占位符
          git remote set-url origin https://x-access-token:${{ secrets.MY_PAT }}@github.com/${{ github.repository }}.git
          
          # 执行推送
          # 因为 MY_PAT 拥有完整的 repo 权限，所以它可以修改 .github/workflows 目录下的文件
          git push origin main
